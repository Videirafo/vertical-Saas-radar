name: Live Demo Smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: live-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BASE_URL: https://vertical-saas-radar.onrender.com
    steps:
      - name: Wait for public service
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 20 "$BASE_URL/health" > /tmp/health.json; then
              break
            fi
            sleep 10
          done
          node -e "const x=require('/tmp/health.json'); if(x.status!=='ok') process.exit(1)"

      - name: Verify public product surfaces
        run: |
          curl --fail --silent --show-error --max-time 30 "$BASE_URL/" > /tmp/index.html
          grep -q 'Know what changed before it changes your roadmap.' /tmp/index.html

          curl --fail --silent --show-error --max-time 30 "$BASE_URL/api/brief" > /tmp/brief.json
          node -e "const x=require('/tmp/brief.json'); if(x.schema_version!==1 || !Array.isArray(x.meaningful) || !Array.isArray(x.watchlist)) process.exit(1)"

          curl --fail --silent --show-error --max-time 30 "$BASE_URL/api/sources" > /tmp/sources.json
          node -e "const x=require('/tmp/sources.json'); const text=JSON.stringify(x); if(!text.includes('github-releases')) process.exit(1)"

          curl --fail --silent --show-error --max-time 30 "$BASE_URL/openapi.json" > /tmp/openapi.json
          node -e "const x=require('/tmp/openapi.json'); if(x.openapi!=='3.1.0' || !x.paths?.['/api/brief']) process.exit(1)"

          curl --fail --silent --show-error --max-time 30 "$BASE_URL/llms.txt" | grep -q 'Vertical SaaS Radar'
          curl --fail --silent --show-error --max-time 30 "$BASE_URL/sitemap.xml" | grep -q '<urlset'
          curl --fail --silent --show-error --max-time 30 "$BASE_URL/AGENTS.md" | grep -q '## Installation'

      - name: Verify markdown negotiation and security headers
        run: |
          curl --fail --silent --show-error --max-time 30 -H 'Accept: text/markdown' -D /tmp/md.headers "$BASE_URL/" -o /tmp/index.md
          grep -qi '^content-type: text/markdown' /tmp/md.headers
          grep -q '^# Vertical SaaS Radar' /tmp/index.md

          curl --fail --silent --show-error --max-time 30 -D /tmp/html.headers "$BASE_URL/" -o /dev/null
          grep -qi '^x-content-type-options: nosniff' /tmp/html.headers
          grep -qi '^referrer-policy:' /tmp/html.headers
